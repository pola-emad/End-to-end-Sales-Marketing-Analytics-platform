version: 2

models:
    # dimension tables
  - name: dim_customers
    description: All customers' details. Includes anonymous users who used guest checkout.
    semantic_model:
      enabled: true
    columns:
      - name: sk_customer
        description: Surrogate key of the customer dimension.
        
        entity:
          name: customers
          type: primary

        data_tests:
          - unique
          - not_null

  - name: dim_products
    semantic_model:
      enabled: true

    columns:
      - name: sk_product 

        entity:
          name: products
          type: primary
          
        data_tests: 
          - unique
          - not_null
          
  - name: dim_channels
    semantic_model:
      enabled: true
    description: Channels data. Allows you to analyze linked facts from the channels perspective.
    columns:
      - name: sk_channel
        description: surrogat key of the channels dimension
        entity:
          name: channels
          type: primary
        data_tests:
          - not_null
          - unique
          
  - name: dim_date
    description: Date data. Allows you to analyze linked facts from the dateperspective.
    time_spine: 
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: surrogate key for the date dimension
        granularity: day
        data_tests:
          - not_null
          - unique
  # facts
  - name: fct_purchase_history
    semantic_model:
      enabled: true
      name: purchase_history
    
    agg_time_dimension: order_date
    
    columns:
      # entities
      - name: sk_purchase_history
        entity:
          name: orders
          type: primary
          
        data_tests:
          - unique
          - not_null
      - name: sk_customer
        entity:
          name: customers
          type: foreign

        data_tests:
          - relationships:
              arguments: 
                to: ref('dim_customers')
                field: sk_customer

      - name: sk_product
        entity:
          name: products
          type: foreign

        data_tests:
          - relationships:
              arguments: 
                to: ref('dim_products')
                field: sk_product

      - name: sk_channel
        entity:
          name: channels
          type: foreign
        data_tests:
          - relationships:
              arguments: 
                to: ref('dim_channels')
                field: sk_channel
      # dimensions
      - name: dt_order_date
        granularity: day
        dimension: 
          type: time
          name: order_date
      
      - name: mtr_quantity
        description: Total quantity of products purchased by the customer.
      
      - name: mtr_discount
        description: discount percentage
      
      - name: mtr_total_amount_gross
        description: Total amount of the purchase before discount
      
      - name: mtr_total_amount_net
        description: Total amount of the purchase after discount
    # simple metrics
    metrics: 

      - name: order_count
        type: simple
        agg: sum
        expr: 1

      - name: total_revenue
        description: total money earned from the purchases after discount
        type: simple
        agg: sum
        expr: mtr_total_amount_net

      - name: total_gross_revenue
        description: total money of the purchases before discount
        type: simple
        agg: sum
        expr: mtr_total_amount_gross

  - name: fct_visits_history
    semantic_model:
      enabled: true
      name: visits_history

    agg_time_dimension: visit_time
    
    columns:
      # entities
      - name: sk_visit
        entity: 
          type: primary
          name: visits

      - name: sk_customer

        entity: 
          type: foreign
          name: customers

        data_tests:
          - relationships:
              arguments: 
                to: ref('dim_customers')
                field: sk_customer

      - name: sk_channel

        entity: 
          type: foreign
          name: channels

        data_tests:
          - relationships:
              arguments: 
                to: ref('dim_channels')
                field: sk_channel

      - name: sk_date_visit
        granularity: day
        entity: 
          type: foreign
          name: visit_date

      - name: sk_date_bounce
        granularity: day
        entity: 
          type: foreign
          name: bounce_date
      
      # dimensions
      - name: dt_visit_timestamp
        granularity: minute
      
        dimension:
          type: time
          name: visit_time
      
      - name: dt_bounce_timestamp
        granularity: minute
      
        dimension:
          type: time
          name: bounce_time

      # normal columns
      - name: mtr_length_of_stay_minutes

          
    # simple metrics
    metrics: 
      - name: total_visits
        description: total number of visits to the website
        type: simple
        agg: sum
        expr: 1

      - name: total_stay_minutes
        description: total time spent on the website in minutes
        type: simple
        agg: sum
        expr: mtr_length_of_stay_minutes

metrics:
  - name: avg_stay_minutes
    type: ratio
    label: Average Stay Minutes
    numerator:
      name: total_stay_minutes
    denominator:
      name: total_visits

  - name: avg_revenue_per_visit
    type: ratio
    label: Average Revenue per Visit
    numerator:
      name: total_revenue
    denominator:
      name: total_visits

  - name: monthly_revenue
    type: cumulative
    input_metric: total_revenue
    window: 1 month
    
  - name: d7_visits_change
    type: derived
    expr: current_visits - visits_7_days_ago
    input_metrics:
      - name: total_visits
        alias: current_visits
      
      - name: total_visits
        offset_window: 7 days
        alias: visits_7_days_ago